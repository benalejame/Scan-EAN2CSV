    <script>
        let codigosGuardados = JSON.parse(localStorage.getItem('ean_lote_cache')) || [];
        let html5Qrcode = null;
        let ultimoCodigoEscaneado = null;
        let tiempoUltimoEscaneo = 0;
        let audioCtx = null;
        let linternaEncendida = false;
        let escaneoBloqueado = false; 

        document.getElementById('startScan').addEventListener('click', alternarEscaner);
        document.getElementById('toggleTorch').addEventListener('click', alternarLinterna);
        document.getElementById('exportCSV').addEventListener('click', exportarA_CSV);
        document.getElementById('exportBAT').addEventListener('click', exportarA_BAT);
        document.getElementById('clearList').addEventListener('click', mostrarModalLimpiar);
        document.getElementById('btnCancel').addEventListener('click', ocultarModalLimpiar);
        document.getElementById('btnConfirm').addEventListener('click', ejecutarLimpieza);

        window.addEventListener('click', inicializarAudio, { once: false });
        window.addEventListener('touchstart', inicializarAudio, { once: false });

        actualizarTabla();

        function inicializarAudio() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch(e) { console.error("Error al inicializar contexto de audio:", e); }
        }

        function emitirPitido() {
            try {
                inicializarAudio(); 
                if (!audioCtx) return;
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = 'sine';
                oscillator.frequency.value = 1000; 
                gainNode.gain.setValueAtTime(1.0, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.15);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) { console.error("Error de audio:", e); }
        }

        function emitirPitidoError() {
            try {
                inicializarAudio();
                if (!audioCtx) return;
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc1.connect(gainNode);
                osc2.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc1.type = 'sine';
                osc2.type = 'sine';
                osc1.frequency.value = 150; 
                osc2.frequency.value = 155; 
                gainNode.gain.setValueAtTime(1.0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.00001, audioCtx.currentTime + 0.35);
                osc1.start(audioCtx.currentTime);
                osc2.start(audioCtx.currentTime);
                osc1.stop(audioCtx.currentTime + 0.35);
                osc2.stop(audioCtx.currentTime + 0.35);
            } catch (e) { console.error("Error de audio error:", e); }
        }

        // Validador inteligente que repara las lecturas truncadas por la cámara
        function procesarYValidarCodigo(codigo) {
            let str = codigo.trim();
            if (!/^\d+$/.test(str)) return { valido: false };

            // Si la cámara lee 12 dígitos, es un EAN-13 al que se le ha caído el cero inicial
            if (str.length === 12) {
                str = '0' + str;
            }

            if (str.length !== 8 && str.length !== 13) return { valido: false };

            const digitos = str.split('').map(Number);
            const digitoControlOriginal = digitos.pop();
            
            digitos.reverse(); 
            
            let suma = 0;
            for (let i = 0; i < digitos.length; i++) {
                if (i % 2 === 0) {
                    suma += digitos[i] * 3;
                } else {
                    suma += digitos[i] * 1;
                }
            }

            const residuo = suma % 10;
            const digitoCalculado = residuo === 0 ? 0 : 10 - residuo;

            return {
                valido: digitoCalculado === digitoControlOriginal,
                codigoProcesado: str
            };
        }

        function alternarEscaner() {
            const placeholder = document.getElementById('camera-placeholder');
            const btn = document.getElementById('startScan');

            if (html5Qrcode && html5Qrcode.isScanning) {
                detenerCamara();
            } else {
                placeholder.style.display = 'block';
                btn.innerText = "Detener Escáner";
                btn.style.backgroundColor = "#f59e0b";
                escaneoBloqueado = false;
                
                if (!html5Qrcode) {
                    html5Qrcode = new Html5Qrcode("camera-placeholder");
                }

                const config = { 
                    fps: 30, 
                    qrbox: function(width, height) {
                        return { width: Math.floor(width * 0.90), height: Math.floor(height * 0.35) }
                    },
                    videoConstraints: {
                        facingMode: "environment",
                        width: { min: 1280, ideal: 1920 },
                        height: { min: 720, ideal: 1080 },
                        focusMode: "continuous"
                    },
                    experimentalFeatures: {
                        useBarCodeDetectorIfSupported: true 
                    },
                    formatsToSupport: [ 
                        Html5QrcodeSupportedFormats.EAN_13, 
                        Html5QrcodeSupportedFormats.EAN_8,
                        Html5QrcodeSupportedFormats.UPC_A // Clave para forzar la lectura si se come el cero
                    ]
                };

                html5Qrcode.start(
                    { facingMode: "environment" }, 
                    config, 
                    onScanSuccess,
                    () => {} 
                )
                .then(() => {
                    const botonLinterna = document.getElementById('toggleTorch');
                    if (html5Qrcode.getRunningTrackCapabilities().torch) {
                        botonLinterna.style.display = 'block';
                    }
                    const feedbackRegion = document.getElementById('camera-placeholder');
                    if (feedbackRegion) {
                        const styleNode = document.createElement('style');
                        styleNode.innerHTML = `#camera-placeholder div[style*="font-size: font-size"], #camera-placeholder div[style*="text-align: center"] { display: none !important; }`;
                        feedbackRegion.appendChild(styleNode);
                    }
                })
                .catch(err => { 
                    console.error("Error de cámara:", err);
                    detenerCamara(); 
                });
            }
        }

        function alternarLinterna() {
            if (html5Qrcode && html5Qrcode.isScanning) {
                linternaEncendida = !linternaEncendida;
                html5Qrcode.applyVideoConstraints({
                    advanced: [{ torch: linternaEncendida }]
                }).then(() => {
                    document.getElementById('toggleTorch').innerText = linternaEncendida ? "❌ Apagar Linterna" : "💡 Encender Linterna";
                }).catch(err => console.error("Error con la linterna:", err));
            }
        }

        function onScanSuccess(decodedText) {
            if (escaneoBloqueado) return;

            const resultado = procesarYValidarCodigo(decodedText);
            const codigoFinal = resultado.codigoProcesado || decodedText;

            const ahora = Date.now();
            const tiempoEspera = (codigoFinal === ultimoCodigoEscaneado) ? 1200 : 600;

            if (ahora - tiempoUltimoEscaneo < tiempoEspera) return;

            escaneoBloqueado = true;
            if (html5Qrcode) { html5Qrcode.pause(); }

            const placeholder = document.getElementById('camera-placeholder');

            if (!resultado.valido) {
                emitirPitidoError();
                placeholder.classList.add('scan-error-border'); 
                
                const canvasInterno = placeholder.querySelector('canvas');
                if (canvasInterno) {
                    const ctx = canvasInterno.getContext('2d');
                    if (ctx) ctx.clearRect(0, 0, canvasInterno.width, canvasInterno.height);
                }

                if (navigator.vibrate) { navigator.vibrate([100, 60, 100]); }

                setTimeout(() => {
                    placeholder.classList.remove('scan-error-border');
                    escaneoBloqueado = false;
                    if (html5Qrcode && html5Qrcode.isScanning) { html5Qrcode.resume(); }
                }, 1000); 
                
                return;
            }

            ultimoCodigoEscaneado = codigoFinal;
            tiempoUltimoEscaneo = ahora;
            
            emitirPitido();
            if (navigator.vibrate) { navigator.vibrate(60); }

            const ahoraFecha = new Date();
            const horaFormateada = ahoraFecha.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
            
            codigosGuardados.unshift({ ean: codigoFinal, fecha: horaFormateada });
            
            localStorage.setItem('ean_lote_cache', JSON.stringify(codigosGuardados));
            actualizarTabla();

            setTimeout(() => {
                escaneoBloqueado = false;
                if (html5Qrcode && html5Qrcode.isScanning) {
                    html5Qrcode.resume();
                }
            }, tiempoEspera);
        }

        function detenerCamara() {
            const btn = document.getElementById('startScan');
            const botonLinterna = document.getElementById('toggleTorch');
            const placeholder = document.getElementById('camera-placeholder');
            botonLinterna.style.display = 'none';
            linternaEncendida = false;
            escaneoBloqueado = false;
            placeholder.classList.remove('scan-error-border');
            botonLinterna.innerText = "💡 Encender Linterna";

            if (html5Qrcode && html5Qrcode.isScanning) {
                html5Qrcode.stop().then(() => { 
                    placeholder.style.display = 'none'; 
                    ultimoCodigoEscaneado = null; 
                    btn.innerText = "Iniciar Escáner";
                    btn.style.backgroundColor = "#10b981";
                }).catch(err => console.error("Error al detener:", err));
            } else { 
                placeholder.style.display = 'none'; 
                btn.innerText = "Iniciar Escáner";
                btn.style.backgroundColor = "#10b981";
            }
        }

        function actualizarTabla() {
            const tbody = document.getElementById('lista-codigos');
            document.getElementById('count').innerText = codigosGuardados.length;
            if(codigosGuardados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2" style="text-align: center; color: #94a3b8; padding: 20px;">Ningún código escaneado</td></tr>`;
                return;
            }
            tbody.innerHTML = "";
            codigosGuardados.forEach((item, index) => {
                const claseResaltado = (index === 0) ? 'class="last-scanned"' : '';
                tbody.innerHTML += `<tr ${claseResaltado}><td>${item.ean}</td><td>${item.fecha}</td></tr>`;
            });
        }

        function exportarA_CSV() {
            if (codigosGuardados.length === 0) { alert("El lote está vacío."); return; }
            let csvContent = "EAN,Hora de Captura\n";
            [...codigosGuardados].reverse().forEach(item => { csvContent += `"${item.ean}","${item.fecha}"\n`; });
            const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `lote_inventario_${Date.now()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function exportarA_BAT() {
            if (codigosGuardados.length === 0) { alert("El lote está vacío."); return; }
            const cifrasSeparadasPorTab = [...codigosGuardados].reverse().map(item => item.ean).join("\t");
            const batContent = `@echo off\nsetlocal\nset cifras=${cifrasSeparadasPorTab}\necho.\necho =======================================================\necho Pegando cifras en la ventana activa con Enter\necho =======================================================\necho.\necho Tienes 3 segundos para activar la ventana donde quieres pegar.\necho.\ntimeout /t 3 > NUL\nfor %%c in (%cifras%) do (\n    powershell -command "$wshell = New-Object -ComObject wscript.shell; $wshell.SendKeys('%%c'); $wshell.SendKeys('{ENTER}')"\n)\necho.\necho Proceso de pegado completado.\necho.\nendlocal\nexit`;
            const blob = new Blob([batContent], { type: 'text/plain;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `autopegar_lote_${Date.now()}.bat`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function mostrarModalLimpiar() { document.getElementById('confirmModal').classList.add('active'); }
        function ocultarModalLimpiar() { document.getElementById('confirmModal').classList.remove('active'); }
        function ejecutarLimpieza() {
            codigosGuardados = []; 
            ultimoCodigoEscaneado = null; 
            localStorage.removeItem('ean_lote_cache'); 
            actualizarTabla(); 
            ocultarModalLimpiar();
        }
    </script>
</body>
